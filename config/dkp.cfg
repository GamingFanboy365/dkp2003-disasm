# Analyzer hints for Diddy Kong Pilot (2003 build)
# overlay <name> <rom_start> <rom_end> <vma>
overlay iwram 0x385fc 0x3c5c4 0x03000000
# Rare's ARM audio engine, copied to IWRAM by the audio init (size word at 0x2D830)
overlay audio 0x2d834 0x2eae0 0x03006498
# game_init copies one of two ARM overlays right after text32: ovl_a
# (sub_08000CB8, normal races) or ovl_b (sub_08001020, when bit 13 of the
# mode flags at 0x0300566C is set)
overlay ovl_a 0x3c5c4 0x3dc1c 0x03003fc8
overlay ovl_b 0x3dc1c 0x3ea90 0x03003fc8
# end of the Thumb code area in the main ROM segment (rodata begins here)
code_end 0x385fc
arm_area 0x3c5c4 0x3ea90   # the two ARM overlays; rodata (sine table first) starts at 0x3EA90
# ROM header (between the entry branch and crt0)
data 0x4 0xc0
arm_func 0x08000000 _start
arm_func 0x03000000 IntrMain
thumb_func 0x08000115 AgbMain

