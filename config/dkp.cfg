# Analyzer hints for Diddy Kong Pilot (2003 build)
# overlay <name> <rom_start> <rom_end> <vma>
overlay iwram 0x385fc 0x3c5c4 0x03000000
# end of the Thumb code area in the main ROM segment (rodata begins here)
code_end 0x385fc
arm_area 0x3c5c4 0x3ea90   # two ARM overlays, copied to IWRAM 0x03003FC8 by game_init; rodata (sine table first) starts at 0x3EA90
# ROM header (between the entry branch and crt0)
data 0x4 0xc0
arm_func 0x08000000 _start
arm_func 0x03000000 IntrMain
thumb_func 0x08000115 AgbMain

